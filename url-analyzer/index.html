<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard AI | URL Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(51, 65, 85, 0.5);
            --primary-blue: #38bdf8;
            --danger-red: #f43f5e;
            --success-green: #10b981;
            --text-gray: #94a3b8;
            --glass-blur: blur(12px);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% -20%, #1e293b 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, #0f172a 0%, transparent 30%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .hero-section {
            width: 100%;
            max-width: 850px;
            padding: 40px;
            text-align: center;
        }

        .analyzer-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 60px 40px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .home-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .home-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .brand-label {
            color: var(--primary-blue);
            font-weight: 800;
            letter-spacing: 0.2em;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: block;
        }

        h1 { 
            font-size: 3.5rem; 
            font-weight: 800; 
            margin: 0 0 10px 0;
            background: linear-gradient(to bottom, #fff 60%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { color: var(--text-gray); margin-bottom: 40px; }

        .input-group {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            padding: 8px;
            gap: 10px;
        }

        input {
            background: transparent;
            border: none;
            color: white;
            padding: 12px 20px;
            flex: 1;
            outline: none;
            font-size: 1rem;
        }

        .scan-btn {
            background: linear-gradient(90deg, #06b6d4, #3b82f6);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Results Logic Placeholder */
        .progress-wrapper { display: none; margin-top: 30px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-top: 15px; }
        #scanBar { width: 0%; height: 100%; background: var(--primary-blue); transition: width 0.3s; }
    </style>
</head>
<body>

<div class="hero-section">
    <div class="analyzer-card">
        <a href="../index.html" class="home-btn"><i class="fas fa-home"></i></a>
        
        <span class="brand-label">PhishGuard AI</span>
        <h1>Deep Analysis</h1>
        <p class="subtitle">Multi-vector phishing detection engine.</p>

        <div id="inputArea">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="Paste suspicious URL here...">
                <button class="scan-btn" onclick="runScan()">
                    <i class="fas fa-bolt"></i> SCAN
                </button>
            </div>
        </div>

        <div id="progressUI" class="progress-wrapper">
            <p id="statusText" style="color: var(--primary-blue); font-size: 0.8rem; font-weight: 700;"></p>
            <div class="progress-bar">
                <div id="scanBar"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function runScan() {
        const url = document.getElementById('urlInput').value;
        if(!url) return alert("Please paste a URL");
        
        document.getElementById('inputArea').style.display = 'none';
        document.getElementById('progressUI').style.display = 'block';
        
        let bar = document.getElementById('scanBar');
        let status = document.getElementById('statusText');
        let width = 0;
        
        const interval = setInterval(() => {
            width += 5;
            bar.style.width = width + "%";
            if(width < 30) status.innerText = "Analyzing Domain...";
            else if(width < 70) status.innerText = "Checking SSL Trust...";
            else status.innerText = "Finalizing Report...";
            
            if(width >= 100) {
                clearInterval(interval);
                alert("Scan Complete for: " + url);
                location.reload();
            }
        }, 100);
    }
</script>

</body>
</html>
