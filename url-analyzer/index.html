<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard AI | URL Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(51, 65, 85, 0.5);
            --primary-blue: #38bdf8;
            --danger-red: #f43f5e;
            --success-green: #10b981;
            --text-gray: #94a3b8;
            --glass-blur: blur(12px);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, transparent 50%), radial-gradient(circle at 0% 100%, #0f172a 0%, transparent 30%);
            color: white;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
        }

        .analyzer-card {
            background: var(--card-bg); backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color); border-radius: 24px;
            padding: 60px 40px; width: 100%; max-width: 850px;
            position: relative; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .home-btn {
            position: absolute; top: 25px; right: 25px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
            color: white; padding: 10px; border-radius: 12px; text-decoration: none;
        }

        .brand-label { color: var(--primary-blue); font-weight: 800; letter-spacing: 0.2em; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 15px; display: block; }
        h1 { font-size: 3.5rem; font-weight: 800; margin: 0; background: linear-gradient(to bottom, #fff 60%, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-gray); margin-bottom: 40px; }

        .input-group { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color); border-radius: 16px; display: flex; padding: 8px; gap: 10px; }
        input { background: transparent; border: none; color: white; padding: 12px 20px; flex: 1; outline: none; font-size: 1rem; }
        
        .scan-btn {
            background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white;
            border: none; padding: 12px 30px; border-radius: 12px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
        }

        /* Progress UI */
        .progress-wrapper { display: none; margin-top: 30px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-top: 15px; }
        #scanBar { width: 0%; height: 100%; background: var(--primary-blue); transition: width 0.3s; }

        /* Results UI */
        #resultsUI { display: none; margin-top: 40px; animation: fadeIn 0.5s ease; }
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--danger-red);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 20px;
        }
        .score-circle.safe { border-color: var(--success-green); }
        .score-val { font-size: 2rem; font-weight: 800; }
        .score-lab { font-size: 0.6rem; color: var(--text-gray); font-weight: 700; }
        
        .warning-text { font-weight: 700; margin-bottom: 20px; display: block; }
        .text-danger { color: var(--danger-red); }
        .text-success { color: var(--success-green); }
        
        .risk-box {
            background: rgba(0, 0, 0, 0.2); border-radius: 16px; padding: 25px; text-align: left;
        }
        .risk-item { display: flex; align-items: center; gap: 12px; color: var(--text-gray); font-size: 0.9rem; margin-bottom: 10px; }
        .risk-item i.fa-exclamation-triangle { color: var(--danger-red); }
        .risk-item i.fa-check-circle { color: var(--success-green); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="analyzer-card">
    <a href="../index.html" class="home-btn"><i class="fas fa-home"></i></a>
    <span class="brand-label">PhishGuard AI</span>
    <h1>Deep Analysis</h1>
    <p class="subtitle">Multi-vector phishing detection engine.</p>

    <div id="mainUI">
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste suspicious URL here...">
            <button class="scan-btn" onclick="runScan()">
                <i class="fas fa-bolt"></i> SCAN
            </button>
        </div>
    </div>

    <div id="progressUI" class="progress-wrapper">
        <p id="statusText" style="color: var(--primary-blue); font-size: 0.8rem; font-weight: 700;"></p>
        <div class="progress-bar">
            <div id="scanBar"></div>
        </div>
    </div>

    <div id="resultsUI">
        <div class="score-circle" id="scoreCircle">
            <span class="score-val" id="resScore">0%</span>
            <span class="score-lab">AI SCORE</span>
        </div>
        <span class="warning-text" id="verdictText"></span>
        
        <div class="risk-box">
            <p style="font-weight: 700; margin-top: 0;" id="riskTitle">Analysis Log:</p>
            <div id="riskList"></div>
        </div>
        <button class="scan-btn" style="margin: 20px auto 0;" onclick="location.reload()">Scan Another</button>
    </div>
</div>

<script>
    function runScan() {
        const url = document.getElementById('urlInput').value.trim();
        if(!url) return;
        
        document.getElementById('mainUI').style.display = 'none';
        document.getElementById('progressUI').style.display = 'block';
        
        let bar = document.getElementById('scanBar');
        let status = document.getElementById('statusText');
        let width = 0;
        
        const interval = setInterval(() => {
            width += 4;
            bar.style.width = width + "%";
            if(width < 25) status.innerText = "Validating Protocol & Characters...";
            else if(width < 50) status.innerText = "Analyzing Domain Registration...";
            else if(width < 75) status.innerText = "Scanning for Typosquatting...";
            else status.innerText = "Checking IP Reputation...";
            
            if(width >= 100) {
                clearInterval(interval);
                showResults(url);
            }
        }, 60);
    }

    function showResults(url) {
        document.getElementById('progressUI').style.display = 'none';
        const resultsUI = document.getElementById('resultsUI');
        const list = document.getElementById('riskList');
        const scoreCircle = document.getElementById('scoreCircle');
        const verdictText = document.getElementById('verdictText');
        const resScore = document.getElementById('resScore');
        
        resultsUI.style.display = 'block';

        let risks = [];
        let score = 0;
        const lowUrl = url.toLowerCase();

        // 1. Trusted Whitelist (Constraints Bypass)
        const whiteList = ['google.com', 'youtube.com', 'microsoft.com', 'apple.com', 'github.com', 'linkedin.com'];
        const isWhitelisted = whiteList.some(domain => lowUrl.includes(domain) && !lowUrl.includes('verify-') && !lowUrl.includes('-update'));

        if (isWhitelisted) {
            score = 0;
            risks.push({text: "Verified Trusted Domain: High Reputation.", safe: true});
            risks.push({text: "Protocol Validation: Secure HTTPS.", safe: true});
            risks.push({text: "Domain Age: Mature (Validated).", safe: true});
        } else {
            // 2. Protocol Restriction
            if(!url.startsWith('https://')) {
                risks.push({text: "Protocol Risk: Insecure connection (No HTTPS).", safe: false});
                score += 25;
            }

            // 3. Character & Structure Validation
            if(/[^\x00-\x7F]/.test(url)) {
                risks.push({text: "Character Validation: Punycode/Internationalized characters detected.", safe: false});
                score += 30;
            }
            if((url.match(/\./g) || []).length > 3) {
                risks.push({text: "Structure Risk: Excessive subdomains detected.", safe: false});
                score += 15;
            }

            // 4. Typosquatting & Brand Impersonation
            const brandTargets = ['google', 'youtube', 'paypal', 'microsoft', 'netflix', 'amazon'];
            brandTargets.forEach(brand => {
                if(lowUrl.includes(brand) && !whiteList.some(w => lowUrl.includes(w))) {
                    risks.push({text: `Typosquatting: Potential ${brand} impersonation detected.`, safe: false});
                    score += 40;
                }
            });

            // 5. Character Validation (Excessive Hyphens)
            if((url.match(/-/g) || []).length > 2) {
                risks.push({text: "Structure Validation: Unusual hyphenation patterns.", safe: false});
                score += 10;
            }

            // 6. Length Restrictions
            if(url.length > 75) {
                risks.push({text: "Length Restriction: Abnormally long URL used for masking.", safe: false});
                score += 10;
            }
        }

        // Final UI Rendering
        score = Math.min(score, 100);
        resScore.innerText = score + "%";
        
        if (score > 20) {
            scoreCircle.style.borderColor = "#f43f5e";
            verdictText.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Warning: Malicious Content!';
            verdictText.className = "warning-text text-danger";
        } else {
            scoreCircle.style.borderColor = "#10b981";
            verdictText.innerHTML = '<i class="fas fa-check-circle"></i> Result: Safe Website';
            verdictText.className = "warning-text text-success";
        }

        list.innerHTML = risks.map(r => `
            <div class="risk-item">
                <i class="fas ${r.safe ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> 
                ${r.text}
            </div>
        `).join('');
    }
</script>

</body>
</html>
