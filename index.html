<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard AI | Advanced Threat Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background-color: #020617; 
            background-image: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            overflow: hidden; 
        }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); }
        .tab-active { border-bottom: 2px solid #22d3ee !important; color: #22d3ee !important; background: rgba(30, 41, 59, 0.4); }
        
        .card-glow {
            position: relative;
        }
        .card-glow::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; height: 80%;
            background: #0891b2;
            filter: blur(100px);
            opacity: 0.15;
            z-index: -1;
            animation: pulse 6s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.2; transform: translate(-50%, -50%) scale(1.1); }
        }
    </style>
</head>
<body class="text-slate-100 font-sans antialiased min-h-screen">

    <nav class="border-b border-slate-800/50 sticky top-0 z-50 glass">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-cyan-600/20 border border-cyan-500/30 p-2 rounded-xl">
                    <i class="fas fa-shield-alt text-cyan-400"></i>
                </div>
                <span class="font-bold text-xl tracking-tighter bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                    PhishGuard<span class="text-cyan-400">AI</span>
                </span>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 h-[calc(100vh-64px)] flex flex-col justify-center items-center">
        
        <div class="text-center mb-8 w-full">
            <h1 class="text-5xl md:text-6xl font-black mb-4 tracking-tighter leading-tight bg-gradient-to-b from-white via-white to-slate-500 bg-clip-text text-transparent">
                Stop Phishing <br>Before It Happens.
            </h1>
            <p class="text-slate-400 text-lg max-w-lg mx-auto font-light tracking-wide">
                Secure your workspace with <span class="text-cyan-400 font-semibold italic">PhishGuard's</span> real-time neural analysis.
            </p>
        </div>

        <div class="card-glow w-full max-w-xl">
            <div class="bg-slate-900/80 border border-slate-700/50 rounded-[2rem] shadow-2xl overflow-hidden backdrop-blur-xl">
                <div class="flex border-b border-slate-800">
                    <button id="urlTab" onclick="switchTab('url')" class="flex-1 py-4 flex items-center justify-center gap-2 transition-all tab-active">
                        <i class="fas fa-link text-xs"></i>
                        <span class="font-bold tracking-tight text-xs uppercase">URL Scanner</span>
                    </button>
                    <button id="fileTab" onclick="switchTab('file')" class="flex-1 py-4 flex items-center justify-center gap-2 transition-all text-slate-500 hover:text-slate-300">
                        <i class="fas fa-file-shield text-xs"></i>
                        <span class="font-bold tracking-tight text-xs uppercase">File Analysis</span>
                    </button>
                </div>

                <div class="p-8">
                    <div id="urlSection" class="text-center">
                        <div class="bg-slate-950/50 border border-slate-800 rounded-2xl p-6 mb-2">
                            <p class="text-slate-400 text-sm mb-6 leading-relaxed">
                                Our AI inspects URLs for typosquatting, hidden redirects, and zero-day malicious behavior.
                            </p>
                            <a href="url-analyzer/index.html" 
                               class="group relative inline-flex w-full items-center justify-center gap-3 bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-cyan-900/20 active:scale-[0.97]">
                                <i class="fas fa-bolt text-xs group-hover:animate-pulse"></i>
                                <span class="uppercase tracking-[0.15em] text-xs">Open URL Analyzer</span>
                            </a>
                        </div>
                    </div>

                    <div id="fileSection" class="hidden">
                        <a href="file-analyzer/index.html" 
                           class="group relative inline-flex w-full items-center justify-center gap-3 bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-[0.97]">
                            <i class="fas fa-cloud-upload-alt text-xs"></i>
                            <span class="uppercase tracking-[0.15em] text-xs">Open File Analyzer</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function switchTab(type) {
            const urlSection = document.getElementById('urlSection');
            const fileSection = document.getElementById('fileSection');
            const urlTab = document.getElementById('urlTab');
            const fileTab = document.getElementById('fileTab');

            if (type === 'url') {
                urlSection.classList.remove('hidden');
                fileSection.classList.add('hidden');
                urlTab.classList.add('tab-active');
                urlTab.classList.remove('text-slate-500');
                fileTab.classList.remove('tab-active');
                fileTab.classList.add('text-slate-500');
            } else {
                fileSection.classList.remove('hidden');
                urlSection.classList.add('hidden');
                fileTab.classList.add('tab-active');
                fileTab.classList.remove('text-slate-500');
                urlTab.classList.remove('tab-active');
                urlTab.classList.add('text-slate-500');
            }
        }
    </script>
</body>
</html>
